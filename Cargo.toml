[package]
name = "flick"
version = "0.1.0"
edition = "2024"
description = "A focused desktop video player built with Rust and GPUI"
publish = false

[dependencies]
anyhow = "1"
directories = "6"
gpui = "=0.2.2"
image = { version = "0.25", default-features = false }
libloading = "0.8"
# GPUI 0.2.2 pulls xattr 0.2.3, which needs the ENOATTR alias removed in libc 0.2.190.
libc = "=0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
